name: Build and Release Executables

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Enter the version (e.g., V1.0.0)"
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format and tag availability
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^V[0-9]+\.[0-9]+.* ]]; then
            echo "Invalid version '$VERSION'. Expected format: V0.0..."
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Tag '$VERSION' already exists. Choose a different version."
            exit 1
          fi
        shell: bash

  build:
    needs: validate

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build executable
        run: pyinstaller --onefile src/__main__.py

      - name: Rename executable
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/__main__.exe "dist/NMS-save-parser-${VERSION}-windows.exe"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/__main__ "dist/NMS-save-parser-${VERSION}-linux"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/__main__ "dist/NMS-save-parser-${VERSION}-macos"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NMS-save-parser-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Make Linux and macOS files executable
        run: chmod +x NMS-save-parser-*-linux NMS-save-parser-*-macos || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            NMS-save-parser-${{ github.event.inputs.version }}-linux
            NMS-save-parser-${{ github.event.inputs.version }}-windows.exe
            NMS-save-parser-${{ github.event.inputs.version }}-macos